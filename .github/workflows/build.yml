name: Build Tweak

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-20.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install Theos
      run: |
        export THEOS=/opt/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y fakeroot git make perl gcc
        sudo apt-get install -y libssl-dev libxml2-dev

    - name: Install iOS toolchain
      run: |
        cd $THEOS/toolchain
        mkdir -p linux/iphone
        cd linux/iphone
        wget -q https://github.com/ProcursusTeam/procursus/releases/download/2023.07.18_ios-toolchain/ios-toolchain_linux-x86_64.tar.xz
        tar xJf ios-toolchain_linux-x86_64.tar.xz
        rm ios-toolchain_linux-x86_64.tar.xz

    - name: Install iOS SDK
      run: |
        mkdir -p $THEOS/sdks
        cd $THEOS/sdks
        wget -q https://github.com/xybp888/iOS-SDKs/raw/master/iPhoneOS14.0.sdk.tar.gz
        tar xzf iPhoneOS14.0.sdk.tar.gz
        rm iPhoneOS14.0.sdk.tar.gz

    - name: Build
      run: |
        cd $GITHUB_WORKSPACE
        make package FINAL=yes

    - name: Upload dylib
      uses: actions/upload-artifact@v2
      with:
        name: ChinaMobileAdBlock-dylib
        path: |
          .theos/obj/debug/*.dylib
          packages/*.deb
