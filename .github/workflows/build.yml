name: Build Tweak

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y fakeroot ssh clang build-essential
        sudo apt-get install -y libssl-dev libxml2-dev

    - name: Install toolchain
      run: |
        cd $THEOS/toolchain
        mkdir -p linux/iphone
        cd linux/iphone
        wget -q https://github.com/CRKokushurin/theos-toolchain-linux-x86_64/archive/refs/heads/main.tar.gz
        tar xzf main.tar.gz
        mv theos-toolchain-linux-x86_64-main/* .
        rm -rf theos-toolchain-linux-x86_64-main main.tar.gz

    - name: Download iOS SDK
      run: |
        mkdir -p $THEOS/sdks
        cd $THEOS/sdks
        wget -q https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
        tar xzf master.tar.gz
        mv sdks-master/iPhoneOS14.5.sdk .
        rm -rf sdks-master master.tar.gz

    - name: Build
      run: |
        cd $GITHUB_WORKSPACE
        make package FINAL=yes

    - name: Upload dylib
      uses: actions/upload-artifact@v4
      with:
        name: ChinaMobileAdBlock-dylib
        path: |
          .theos/obj/debug/*.dylib
          packages/*.deb
